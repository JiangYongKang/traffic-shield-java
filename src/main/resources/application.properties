# ===== 流量防护 traffic-shield 配置 =====

# 安全检测总开关：false 时跳过安全规则匹配（限流仍然生效）
traffic-shield.enabled=true

# 内置默认限流规则：每个来源在 windowSeconds 秒的固定窗口内最多 limit 次
traffic-shield.default-limit=10
traffic-shield.default-window-seconds=10

# 来源识别请求头（取第一个值；不存在时回退到对端 IP）
traffic-shield.source-header=X-Forwarded-For

# 限流器过期计数窗口的清理间隔（秒）
traffic-shield.sweep-interval-seconds=10

# 日志级别：单测/本地验证时可看到每个请求的特征与判定依据
logging.level.com.github.highcumontoa=INFO

# 限流器状态容量上限（存活窗口 + 回收影子共用的条目预算），超限按回收策略释放
traffic-shield.max-state-entries=10000
